[project]
name = "lit"
version = "0.4.0"
description = "Universal command line agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "inquirerpy>=0.3.4",
    "markdownify>=1.2.3",
    "openai>=2.46.0",
    "questionary>=2.1.1",
    "readability-lxml>=0.8.4.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tavily-python>=0.7.26",
    "trafilatura>=2.1.0",
    "wcwidth>=0.8.2",
    "windows-curses>=2.4.2; sys_platform == 'win32'",
]
